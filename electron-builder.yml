appId: com.writara.desktop
productName: Writara
copyright: Copyright © 2026 NBullet

directories:
  output: release

# 直接用已安装的 Electron，避免打包时再从 GitHub 下载整包（内网经常 ECONNRESET）。
electronDist: node_modules/electron/dist

files:
  - dist/**
  - dist-electron/**
  - electron/preload.cjs
  - package.json
  # 主进程 sourcemap 只用于本地排查，不随安装包分发（运行时也不会读它）。
  - "!dist-electron/**/*.map"
  # 渲染进程已经打包进 dist/，主进程是单文件 bundle；运行时不需要任何 node_modules。
  # 不加这条，electron-builder 会把所有 dependencies（mermaid、katex、codemirror…）
  # 原样塞进 app.asar，体积会从 ~15MB 涨到 200MB+。
  - "!**/node_modules/**"

# Word 导出的参考模板：Pandoc 用 --reference-doc 读取，必须能在打包后的
# resourcesPath/templates 下找到（见 electron/pandoc.ts 的 templateDirs）。
extraResources:
  - from: resources/templates
    to: templates

# 在线更新的来源。`releaseType: draft` 表示构建后先出草稿，人工确认再在 GitHub 上发布；
# `electron-updater` 只认已发布的 release。owner/repo 必须替换成真实仓库。
publish:
  provider: github
  owner: NBullet
  repo: Writara
  releaseType: draft

fileAssociations:
  - ext:
      - md
      - markdown
      - mdx
      - txt
    name: Markdown
    description: Markdown 文档
    role: Editor

win:
  # 安装包未签名：electron-updater 的 Authenticode 校验会拒绝未签名的更新包。
  # 签名之后删掉这一行（让更新校验发布者），并在 win.sign 里配置证书。
  verifyUpdateCodeSignature: false
  target:
    - nsis
    - portable

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

mac:
  target:
    - dmg
  category: public.app-category.productivity

linux:
  target:
    - AppImage
    - deb
  category: Office
